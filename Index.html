<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ally's 7th Birthday Party Invitation!</title>
  <!-- Google Fonts for Barbie Header -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Sniglet:wght@800&display=swap" rel="stylesheet">
  <style>
    :root {
      --barbie-pink: #E0007B;
      --barbie-dark-pink: #B80063;
      --barbie-light-pink: #FFD1E8;
      --gold-accent: #D4AF37;
      --white: #FFFFFF;
      --text-dark: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Fixed Lower Left Barbie Background Decal */
    .barbie-fixed-decal {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 260px;
      max-width: 35vw;
      height: auto;
      z-index: 10;
      pointer-events: none;
      filter: drop-shadow(0px 8px 15px rgba(224, 0, 123, 0.4));
    }

    @media (max-width: 768px) {
      .barbie-fixed-decal {
        width: 180px;
        opacity: 0.85;
      }
    }

    /* Sparkle Canvas */
    #sparkle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }

    /* Floating Music Toggle Button */
    .music-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: var(--barbie-pink);
      color: var(--white);
      border: 2px solid var(--gold-accent);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(224, 0, 123, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
    }

    .music-btn:hover {
      transform: scale(1.1);
    }

    /* Envelope Intro Section */
    .envelope-wrapper {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, rgba(255,209,232,1) 0%, rgba(224,0,123,0.8) 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      transition: opacity 1s ease, visibility 1s ease;
    }

    .envelope-wrapper.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .envelope-title {
      font-family: 'Sniglet', cursive;
      color: #fff;
      -webkit-text-stroke: 2px var(--barbie-pink);
      text-shadow: 3px 3px 0px var(--barbie-dark-pink), 0 0 15px rgba(255,255,255,0.8);
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
      padding: 0 20px;
    }

    .envelope {
      width: 320px;
      height: 220px;
      background: #ff69b4;
      position: relative;
      border-radius: 10px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      cursor: pointer;
      transform-style: preserve-3d;
    }

    .envelope .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 160px solid transparent;
      border-right: 160px solid transparent;
      border-top: 120px solid #e0007b;
      transform-origin: top;
      transition: transform 0.6s ease-in-out;
      z-index: 3;
    }

    .envelope.open .flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .envelope .pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 160px solid #ff85c0;
      border-right: 160px solid #ff85c0;
      border-bottom: 110px solid #ff4da6;
      border-radius: 0 0 10px 10px;
      z-index: 2;
    }

    .envelope .wax-seal {
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      width: 55px;
      height: 55px;
      background: radial-gradient(circle, #ffe066 0%, #d4af37 100%);
      border-radius: 50%;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      border: 2px solid #fff;
    }

    .wax-seal svg {
      width: 32px;
      height: 32px;
      fill: var(--barbie-pink);
    }

    .click-instruction {
      margin-top: 25px;
      color: var(--white);
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 0.9rem;
      background: rgba(224, 0, 123, 0.6);
      padding: 8px 18px;
      border-radius: 20px;
    }

    /* Main Invitation Container */
    .main-container {
      width: 100%;
      max-width: 520px;
      background: var(--white);
      border-radius: 25px;
      padding: 30px 20px;
      margin: 20px;
      box-shadow: 0 20px 50px rgba(224, 0, 123, 0.3);
      border: 4px solid var(--barbie-light-pink);
      text-align: center;
      position: relative;
      z-index: 20;
    }

    /* Classic Barbie Header Typography Style */
    .barbie-header {
      font-family: 'Sniglet', cursive;
      font-size: 2.4rem;
      color: #FFFFFF;
      -webkit-text-stroke: 2.5px var(--barbie-pink);
      text-shadow: 4px 4px 0px var(--barbie-dark-pink), 0 0 12px rgba(224,0,123,0.4);
      letter-spacing: 1px;
      margin-bottom: 5px;
      line-height: 1.2;
    }

    .sub-banner {
      font-family: 'Sniglet', cursive;
      font-size: 1.8rem;
      color: var(--barbie-pink);
      -webkit-text-stroke: 1px #fff;
      text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    /* Borderless & Resizable Slideshow Container */
    .slideshow-container {
      position: relative;
      width: 100%;
      max-height: 550px;
      border: none;
      background: transparent;
      box-shadow: none;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .slide {
      display: none;
      width: 100%;
      height: auto;
    }

    .slide.active {
      display: flex;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.6s ease-in-out;
    }

    .slide img {
      width: 100%;
      height: auto;
      max-height: 550px;
      object-fit: contain;
      border-radius: 12px;
    }

    .prev-btn, .next-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(224, 0, 123, 0.75);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      z-index: 10;
      transition: background 0.3s;
    }

    .prev-btn:hover, .next-btn:hover {
      background: var(--barbie-pink);
    }

    .prev-btn { left: 10px; }
    .next-btn { right: 10px; }

    .photo-counter {
      position: absolute;
      bottom: 12px;
      right: 15px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
    }

    /* Event Details Card */
    .details-card {
      background: #fff0f6;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 25px;
      border: 2px dashed var(--barbie-pink);
    }

    .details-card h3 {
      font-family: 'Sniglet', cursive;
      color: var(--barbie-pink);
      font-size: 1.6rem;
      margin-bottom: 10px;
      -webkit-text-stroke: 0.5px #fff;
    }

    .detail-item {
      margin: 10px 0;
      font-size: 0.95rem;
      color: var(--text-dark);
    }

    .detail-item strong {
      color: var(--barbie-dark-pink);
    }

    .map-btn {
      display: inline-block;
      margin-top: 10px;
      background: linear-gradient(45deg, var(--barbie-pink), #ff69b4);
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      box-shadow: 0 4px 10px rgba(224, 0, 123, 0.3);
      transition: transform 0.2s;
    }

    .map-btn:hover {
      transform: scale(1.05);
    }

    /* RSVP Form */
    .rsvp-section {
      background: var(--white);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border: 1px solid var(--barbie-light-pink);
    }

    .rsvp-section h3 {
      font-family: 'Sniglet', cursive;
      color: var(--barbie-pink);
      font-size: 1.5rem;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 12px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--barbie-dark-pink);
      margin-bottom: 4px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1.5px solid var(--barbie-light-pink);
      border-radius: 8px;
      outline: none;
      font-family: inherit;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--barbie-pink);
    }

    .submit-btn {
      width: 100%;
      background: var(--barbie-pink);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(224, 0, 123, 0.3);
    }

    @keyframes fadeIn {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>

  <!-- Audio Element -->
  <audio id="barbie-audio" loop preload="auto">
    <source src="The Aqua - Barbie Girl.mp3" type="audio/mpeg">
    <source src="The Aqua - Barbie Girl.mp3" type="audio/mpeg">
    <source src="The Aqua - Barbie Girl.mp3" type="audio/mpeg">
  </audio>

  <!-- Audio Toggle Button -->
  <button class="music-btn" id="music-btn" onclick="toggleAudio()">🎵</button>

  <!-- Sparkle Particle Canvas -->
  <canvas id="sparkle-canvas"></canvas>

  <!-- Fixed Lower Left Barbie Image -->
  <img src="Barbie_2-removebg-preview.png" alt="Barbie Decal" class="barbie-fixed-decal" onerror="this.style.display='none'">

  <!-- Envelope Intro Overlay -->
  <div class="envelope-wrapper" id="envelope-wrapper">
    <div class="envelope-title">Come Barbie, Let's go party! 💖</div>
    <div class="envelope" id="envelope" onclick="openEnvelope()">
      <div class="flap"></div>
      <div class="pocket"></div>
      <div class="wax-seal">
        <svg viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>
    </div>
    <div class="click-instruction">Click Envelope to Open ✨</div>
  </div>

  <!-- Main Invitation Content -->
  <div class="main-container">
    <div class="barbie-header">Come Barbie,<br>Let's Go Party!</div>
    <div class="sub-banner">Ally is turning 7! 👑</div>

    <!-- Borderless Resizable Photo Carousel -->
    <div class="slideshow-container" id="slideshow">
      <button class="prev-btn" onclick="changeSlide(-1)">&#10094;</button>
      <button class="next-btn" onclick="changeSlide(1)">&#10095;</button>
      <div class="photo-counter" id="photo-counter">1 / 67</div>
    </div>

    <!-- Event Details -->
    <div class="details-card">
      <h3>Party Details ✨</h3>
      <div class="detail-item">
        <strong>Celebrant:</strong> Allyxzandra
      </div>
      <div class="detail-item">
        <strong>Date & Time:</strong> Dec. 6, 2026 @ 2:00 PM
      </div>
      <div class="detail-item">
        <strong>Location:</strong> Doria Residence, 33 Gumamela St. Bagong Barrio, Caloocan City
      </div>
      <a href="https://maps.app.goo.gl/JXDwpNeyqFrSqfM68" target="_blank" class="map-btn">📍 Open Google Maps</a>
    </div>

    <!-- RSVP Form -->
    <div class="rsvp-section">
      <h3>RSVP Now</h3>
      <form id="rsvp-form" onsubmit="submitRSVP(event)">
        <div class="form-group">
          <label for="guest-name">Guest Name</label>
          <input type="text" id="guest-name" name="guestName" required placeholder="Your full name">
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="your.email@example.com">
        </div>
        <div class="form-group">
          <label for="attendance">Attendance Status</label>
          <select id="attendance" name="attendance" required>
            <option value="Attending">Joyfully Accepts</option>
            <option value="Not Attending">Regretfully Declines</option>
          </select>
        </div>
        <div class="form-group">
          <label for="adults">Number of Adults</label>
          <input type="number" id="adults" name="adults" min="0" value="1" required>
        </div>
        <div class="form-group">
          <label for="kids">Number of Kids</label>
          <input type="number" id="kids" name="kids" min="0" value="0" required>
        </div>
        <button type="submit" id="submit-btn" class="submit-btn">Send RSVP 💌</button>
      </form>
    </div>
  </div>

  <script>
    // Sorted Chronologically from Oldest (2019) to Most Recent (2026)
    const photos = [
      "IMG_20191212_152105.jpg",
      "IMG_20200113_192332.JPG",
      "IMG20200211123343.jpg",
      "IMG_20200215_084700.jpg",
      "IMG_20200306_112124.jpg",
      "IMG20200314111845.jpg",
      "IMG20200319134737.jpg",
      "IMG_20200407_172513.JPG",
      "IMG20200430103957.jpg",
      "IMG_20200506_092450.jpg",
      "IMG20200523110641.jpg",
      "IMG_20200606_092538.jpg",
      "IMG_20200606_114142.jpg",
      "IMG_20200706_153927_1.jpg",
      "IMG_20200706_180926.jpg",
      "IMG_20200716_184818.jpg",
      "IMG_20200906_133349.jpg",
      "IMG_20201019_094600.jpg",
      "IMG_20201227_133821.jpg",
      "IMG_20210130_215510.jpg",
      "IMG_20220313_171016.jpg",
      "IMG_20220405_191654.jpg",
      "IMG_20220411_085900.jpg",
      "IMG_20220524_111323.jpg",
      "IMG_20220528_122105.jpg",
      "IMG_20220605_225036.jpg",
      "IMG_20220906_140011.jpg",
      "IMG_20221205_175915.jpg",
      "IMG_20221205_195553.jpg",
      "IMG_20221206_114333.jpg",
      "IMG_20221206_114354.jpg",
      "IMG_20230429_151211.jpg",
      "IMG_20230805_210811.jpg",
      "IMG_20230916_155244.jpg",
      "IMG_20230917_091441.jpg",
      "IMG_20231028_101829.jpg",
      "IMG_20231116_095118.jpg",
      "IMG_20231214_103459.jpg",
      "IMG_20231222_104112.jpg",
      "IMG_20240106_164248.jpg",
      "IMG_20240117_090336.jpg",
      "IMG_20240429_123543_839.jpg",
      "IMG_20240429_145046_886.jpg",
      "IMG_20240526_162235_851.jpg",
      "IMG_20240617_141109_662.jpg",
      "IMG_20240707_121225_973.jpg",
      "IMG_20241031_103616_007.jpg",
      "IMG_20241116_212219_956.jpg",
      "IMG_20241117_172548_400.jpg",
      "IMG_20250113_141332_835.jpg",
      "IMG_20250113_141345_965.jpg",
      "IMG_20250209_101615_333.jpg",
      "IMG_20250414_084731_594.jpg",
      "IMG_20250414_115450_531.jpg",
      "IMG_20250509_111309_673.jpg",
      "IMG_20251029_181752.jpg",
      "IMG_20251205_220754.jpg",
      "IMG_20251205_220908.jpg",
      "IMG_20260117_183127.jpg",
      "IMG_20260131_091206.jpg",
      "IMG_20260404_093913_965.jpg",
      "IMG_20260501_141913_926.jpg",
      "IMG_20260501_141948_248.jpg",
      "IMG_20261023_082724.jpg",
      "IMG_20261023_083209.jpg",
      "28665067-e6e9-4f8c-b39c-ec9a22ca0441.jpeg",
      "a7bcb918-e9c0-4eda-afaa-9a8e55c41c88.jpeg"
    ];

    let currentSlide = 0;
    const slideshowEl = document.getElementById('slideshow');
    const audio = document.getElementById('barbie-audio');
    const musicBtn = document.getElementById('music-btn');

    photos.forEach((src, idx) => {
      const slide = document.createElement('div');
      slide.className = `slide ${idx === 0 ? 'active' : ''}`;
      slide.innerHTML = `<img src="${src}" alt="Ally Photo ${idx + 1}">`;
      slideshowEl.appendChild(slide);
    });

    function showSlide(index) {
      const slides = document.querySelectorAll('.slide');
      slides[currentSlide].classList.remove('active');
      currentSlide = (index + slides.length) % slides.length;
      slides[currentSlide].classList.add('active');
      document.getElementById('photo-counter').innerText = `${currentSlide + 1} / ${photos.length}`;
    }

    function changeSlide(direction) {
      showSlide(direction < 0 ? currentSlide - 1 : currentSlide + 1);
    }

    setInterval(() => { changeSlide(1); }, 3500);

    function openEnvelope() {
      document.getElementById('envelope').classList.add('open');
      audio.play().then(() => {
        musicBtn.innerText = '🎵';
      }).catch(err => {
        musicBtn.innerText = '🔇';
      });

      setTimeout(() => {
        document.getElementById('envelope-wrapper').classList.add('hidden');
      }, 900);
    }

    function toggleAudio() {
      if (audio.paused) {
        audio.play().then(() => {
          musicBtn.innerText = '🎵';
        }).catch(err => alert("Audio playback blocked. Ensure The Aqua - Barbie Girl.mp3 is uploaded to your GitHub repository!"));
      } else {
        audio.pause();
        musicBtn.innerText = '🔇';
      }
    }

    function submitRSVP(e) {
      e.preventDefault();
      alert("Thank you for your RSVP! We can't wait to see you at Ally's party! 🎉💖");
      document.getElementById('rsvp-form').reset();
    }

    // Sparkles Effect
    const canvas = document.getElementById('sparkle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 3 + 1;
        this.speedY = Math.random() * 1 - 0.5;
        this.speedX = Math.random() * 1 - 0.5;
        this.opacity = Math.random();
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        if (this.opacity > 0) this.opacity -= 0.005;
        if (this.opacity <= 0) {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.opacity = 1;
        }
      }
      draw() {
        ctx.fillStyle = `rgba(255, 215, 0, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 40; i++) particles.push(new Particle());

    function animateSparkles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateSparkles);
    }
    animateSparkles();
  </script>
</body>
</html>
